name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests (synthetic data only)
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
