name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Report compiler errors as annotations
        run: echo "::add-matcher::.github/swift-problem-matcher.json"
      - name: Unit tests (synthetic data only)
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
