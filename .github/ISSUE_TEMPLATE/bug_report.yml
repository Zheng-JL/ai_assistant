name: Bug report / 问题反馈
description: Something does not work or shows a wrong state
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real conversation logs, tokens, API keys or session titles.** Review any output before posting.
        请勿粘贴真实对话记录、令牌、API Key 或会话标题，贴出前请先检查。
  - type: textarea
    id: what
    attributes:
      label: What happened / 现象
      description: What you saw, and what you expected.
    validations: { required: true }
  - type: textarea
    id: health
    attributes:
      label: Output of `CodexStatus --health`
      description: Run `~/Applications/搭子.app/Contents/MacOS/CodexStatus --health` (or use the menu item "检查运行状况…" → copy report).
      render: text
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Versions
      description: macOS, Codex Desktop, Claude Desktop (and its Claude Code engine version if you know it), this app.
      placeholder: "macOS 26.x, Codex Desktop x.y.z, Claude Desktop x.y.z, 搭子 0.2.0"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
  - type: textarea
    id: unverified
    attributes:
      label: Anything else / 其他
