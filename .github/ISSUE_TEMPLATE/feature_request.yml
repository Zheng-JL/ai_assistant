name: Feature request / 功能建议
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve? / 想解决什么问题
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen? / 期望的行为
  - type: textarea
    id: privacy
    attributes:
      label: Data it would need / 需要读取或发送的数据
      description: Does it need to read conversation text or use the network? That needs an explicit, documented opt-in.
